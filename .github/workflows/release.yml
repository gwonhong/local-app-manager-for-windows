# Builds and publishes a GitHub Release when a version tag is pushed. Per architecture it uploads a
# Velopack Setup.exe, a portable zip, and the update feed (full/delta nupkg + releases.<rid>.json)
# that installed copies update from. scripts/build-installer.ps1 does the actual build.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The tag is the single source of truth for the version: "v0.2.0" builds the
# app as 0.2.0, "v0.3.0-beta.1" as 0.3.0-beta.1 and marks the release as a
# pre-release. Ordinary pushes to branches do not trigger anything.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/LocalAppManager.Core.Tests/LocalAppManager.Core.Tests.csproj -c Release

      # Earlier packages of this channel, so vpk can also build a delta update. There is nothing to
      # fetch before the first Velopack release, hence continue-on-error.
      - name: Download previous release
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ github.token }} `
            --channel ${{ matrix.rid }} `
            --outputDir previous ${{ contains(github.ref_name, '-') && '--pre' || '' }}

      # Same script as a local build: publish, then vpk pack.
      - name: Build installer
        shell: pwsh
        run: >
          ./scripts/build-installer.ps1
          -Platform ${{ matrix.platform }}
          -Version ${{ steps.version.outputs.version }}
          -OutputDir dist
          -PreviousReleasesDir previous

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Re-pushing a moved tag rebuilds it: an existing release keeps its notes and gets its files replaced.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
